[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-lean"
version = "0.1.0"
description = "Lean `claude -p` calls on a Claude subscription: ~600 input tokens instead of 429k, plus a token-bloat tripwire."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "tomahawkeer" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/tomahawkeer/claude-lean"

[tool.setuptools]
packages = ["claude_lean"]
